[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emosvg"
version = "0.1.0"
description = "IP Meme Animation & Multi-dimensional Asset Generation Engine"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
emosvg-server = "src.api.main:start"
emosvg-smoke  = "scripts.smoke_test:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
python_files = ["test_*.py", "smoke_test.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
